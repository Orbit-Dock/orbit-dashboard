<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit | Team Mission Control</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler CDN (for running JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#818cf8',
              600: '#6366f1',
              700: '#4f46e5',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .glow-effect {
      box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function OrbitDashboard() {
      // Mock Activity Feed Data
      const [activities, setActivities] = useState([
        { id: 1, author: "Alex", action: "pushed 3 commits to", branch: "main", message: "feat: add GitHub webhook event parser", time: "5m ago", type: "push" },
        { id: 2, author: "Sam", action: "opened pull request", branch: "dev/ui-fix", message: "fix: responsive task board layout", time: "22m ago", type: "pr" },
        { id: 3, author: "Jan", action: "closed issue", branch: "#42", message: "bug: firestore socket timeout on reconnect", time: "1h ago", type: "issue" }
      ]);

      // Mock Task Board Data
      const [tasks, setTasks] = useState([
        { id: 101, title: "Configure Firebase Firestore Security Rules", assignedTo: "Alex", status: "In Progress", priority: "High" },
        { id: 102, title: "Test Webhook signatures (x-hub-signature-256)", assignedTo: "Sam", status: "To Do", priority: "Medium" },
        { id: 103, title: "Setup GitHub Action for automated gh-pages deployment", assignedTo: "Jan", status: "Done", priority: "Low" }
      ]);

      const [showModal, setShowModal] = useState(false);
      const [newTaskTitle, setNewTaskTitle] = useState("");
      const [newTaskAssignee, setNewTaskAssignee] = useState("Alex");
      const [newTaskPriority, setNewTaskPriority] = useState("Medium");

      // Auto-load icons after render
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activities, tasks, showModal]);

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;

        const newTask = {
          id: Date.now(),
          title: newTaskTitle,
          assignedTo: newTaskAssignee,
          status: "To Do",
          priority: newTaskPriority
        };

        setTasks([newTask, ...tasks]);
        setNewTaskTitle("");
        setShowModal(false);
      };

      const simulateWebhook = () => {
        const authors = ["Alex", "Sam", "Jan", "Mons", "Timmy"];
        const messages = [
          "refactor: optimize commit fetch queries",
          "fix: CORS headers for Vercel functions",
          "docs: update deployment instructions in README",
          "style: dark theme glowing neon accents"
        ];
        
        const randomAuthor = authors[Math.floor(Math.random() * authors.length)];
        const randomMsg = messages[Math.floor(Math.random() * messages.length)];

        const newEvent = {
          id: Date.now(),
          author: randomAuthor,
          action: "pushed 1 commit to",
          branch: "main",
          message: randomMsg,
          time: "Just now",
          type: "push"
        };

        setActivities([newEvent, ...activities]);
      };

      return (
        <div className="max-w-7xl mx-auto p-6">
          
          {/* Top Header */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 pb-4 border-b border-slate-800 gap-4">
            <div className="flex items-center gap-3">
              {/* Atomic Orbit Metallic Logo */}
              <div className="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center glow-effect">
                <i data-lucide="atom" class="w-6 h-6 text-indigo-400"></i>
              </div>
              <div>
                <h1 className="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                  PROJECT ORBIT
                  <span className="text-xs bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/20 font-medium">
                    v1.0 MVP
                  </span>
                </h1>
                <p className="text-xs text-slate-400">Team activity & task control center</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={simulateWebhook}
                className="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 px-3 py-2 rounded-lg font-medium text-xs transition"
              >
                <i data-lucide="radio" class="w-4 h-4 text-emerald-400"></i> Simulate Commit
              </button>
              <button 
                onClick={() => setShowModal(true)}
                className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-lg shadow-indigo-600/25"
              >
                <i data-lucide="plus" class="w-4 h-4"></i> New Task
              </button>
            </div>
          </header>

          {/* Metric Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-400 uppercase tracking-wider">Commits Today</p>
                <p className="text-2xl font-bold mt-1 text-white">{activities.length + 18}</p>
              </div>
              <div className="p-3 bg-indigo-500/10 text-indigo-400 rounded-lg border border-indigo-500/20">
                <i data-lucide="git-commit" class="w-5 h-5"></i>
              </div>
            </div>

            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-400 uppercase tracking-wider">Open PRs</p>
                <p className="text-2xl font-bold mt-1 text-white">2</p>
              </div>
              <div className="p-3 bg-amber-500/10 text-amber-400 rounded-lg border border-amber-500/20">
                <i data-lucide="git-pull-request" class="w-5 h-5"></i>
              </div>
            </div>

            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-400 uppercase tracking-wider">Active Tasks</p>
                <p className="text-2xl font-bold mt-1 text-white">{tasks.filter(t => t.status !== 'Done').length}</p>
              </div>
              <div className="p-3 bg-sky-500/10 text-sky-400 rounded-lg border border-sky-500/20">
                <i data-lucide="check-square" class="w-5 h-5"></i>
              </div>
            </div>

            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
              <div>
                <p className="text-xs text-slate-400 uppercase tracking-wider">Active Team</p>
                <p className="text-2xl font-bold mt-1 text-white">5 Members</p>
              </div>
              <div className="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg border border-emerald-500/20">
                <i data-lucide="users" class="w-5 h-5"></i>
              </div>
            </div>
          </div>

          {/* Main Grid: Feed + Tasks */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Live Git Activity Feed */}
            <div className="lg:col-span-7 bg-slate-900/60 border border-slate-800 rounded-xl p-5">
              <div className="flex justify-between items-center mb-4">
                <h2 className="text-lg font-semibold text-slate-200 flex items-center gap-2">
                  <i data-lucide="activity" class="w-5 h-5 text-indigo-400"></i> Live Git Activity
                </h2>
                <span className="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full flex items-center gap-1">
                  <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Webhook Active
                </span>
              </div>

              <div className="space-y-3">
                {activities.map((act) => (
                  <div key={act.id} className="p-3 bg-slate-950/70 rounded-lg border border-slate-800/80 flex items-start justify-between">
                    <div>
                      <p className="text-sm text-slate-300">
                        <span className="font-semibold text-white">{act.author}</span> {act.action} <span className="text-indigo-400 font-mono text-xs bg-indigo-950/50 px-1.5 py-0.5 rounded border border-indigo-800/40">{act.branch}</span>
                      </p>
                      <p className="text-xs text-slate-400 mt-1 font-mono">{act.message}</p>
                    </div>
                    <span className="text-xs text-slate-500 font-mono">{act.time}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Task Board */}
            <div className="lg:col-span-5 bg-slate-900/60 border border-slate-800 rounded-xl p-5">
              <h2 className="text-lg font-semibold mb-4 text-slate-200 flex items-center gap-2">
                <i data-lucide="list-todo" class="w-5 h-5 text-indigo-400"></i> Specific Work Needed
              </h2>

              <div className="space-y-3">
                {tasks.map((task) => (
                  <div key={task.id} className="p-3 bg-slate-950/70 rounded-lg border border-slate-800/80 flex flex-col gap-2">
                    <div className="flex justify-between items-start">
                      <p className="text-sm text-slate-200 font-medium">{task.title}</p>
                      <span className={`text-[10px] px-2 py-0.5 rounded uppercase font-semibold border ${
                        task.priority === 'High' ? 'bg-red-500/10 text-red-400 border-red-500/20' :
                        task.priority === 'Medium' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                        'bg-slate-800 text-slate-400 border-slate-700'
                      }`}>
                        {task.priority}
                      </span>
                    </div>

                    <div className="flex justify-between items-center text-xs text-slate-400 mt-1 pt-2 border-t border-slate-900">
                      <span>Assigned: <span className="text-slate-200 font-medium">{task.assignedTo}</span></span>
                      <span className="bg-indigo-950/60 text-indigo-300 px-2 py-0.5 rounded border border-indigo-800/50">
                        {task.status}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>

          {/* New Task Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl max-w-md w-full shadow-2xl">
                <h3 className="text-lg font-semibold text-white mb-4">Add Specific Work Needed</h3>
                <form onSubmit={handleAddTask} className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Task Description</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Add rate limiting to Express API" 
                      value={newTaskTitle}
                      onChange={(e) => setNewTaskTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Assign To</label>
                      <select 
                        value={newTaskAssignee}
                        onChange={(e) => setNewTaskAssignee(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="Alex">Alex</option>
                        <option value="Sam">Sam</option>
                        <option value="Jan">Jan</option>
                        <option value="Mons">Mons</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Priority</label>
                      <select 
                        value={newTaskPriority}
                        onChange={(e) => setNewTaskPriority(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                      >
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-sm hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-500"
                    >
                      Save Task
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<OrbitDashboard />);
  </script>
</body>
    </html>
